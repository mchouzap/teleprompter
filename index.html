<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root{
  --font-size:1.6rem;
  --blue:#1e88e5;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
header{
  background:#0d47a1;
  padding:6px 10px;
  font-size:.85rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CONTROLS */
.controls{
  background:#111;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row{
  display:flex;
  gap:6px;
}

button,input{
  height:36px;
  font-size:.95rem;
  border:none;
}

button{
  background:var(--blue);
  color:#fff;
  flex:1;
}

button:disabled{
  opacity:.4;
}

input{
  flex:1;
  padding:0 8px;
}

.hidden{
  display:none !important;
}

/* VIEWER */
#viewer{
  flex:1;
  padding:12px;
  font-size:var(--font-size);
  line-height:1.4;
  overflow:hidden;
}

.line{
  opacity:.35;
  padding:2px 4px;
  cursor:pointer;
}

.line:hover{
  opacity:.7;
}

.active{
  opacity:1;
  background:#fff;
  color:#000;
}

/* FULLSCREEN */
.fullscreen header,
.fullscreen .settings-row{
  display:none;
}
</style>
</head>

<body>

<header id="header">
  Para comenzar agrega un texto via url o carga el archivo *.txt
</header>

<div class="controls">

  <!-- LOAD -->
  <div class="row">
    <button id="btnFile">📂</button>
    <button id="btnLink">🔗</button>
    <input id="urlInput" class="hidden" placeholder="Pega URL .txt y Enter">
  </div>

  <!-- SETTINGS -->
  <div class="row settings-row">
    <button id="timingSet">⏱</button>
    <button id="timingUp">⬆</button>
    <button id="timingDown">⬇</button>

    <button id="fontSet">A</button>
    <button id="fontUp">＋</button>
    <button id="fontDown">－</button>

    <button id="linesSet">≡</button>
  </div>

  <!-- NAV -->
  <div class="row nav-row">
    <button id="playBtn">▶</button>
    <button id="pauseBtn" disabled>⏸</button>
    <button id="backBtn">⏮</button>
    <button id="forwardBtn">⏭</button>
    <button id="fsBtn">⛶</button>
  </div>

</div>

<div id="viewer"></div>
<input type="file" id="fileInput" accept=".txt" hidden>

<script>
/* ================= DOM ================= */
const header = document.getElementById("header");
const viewer = document.getElementById("viewer");

const btnFile = document.getElementById("btnFile");
const btnLink = document.getElementById("btnLink");
const urlInput = document.getElementById("urlInput");
const fileInput = document.getElementById("fileInput");

const timingSet = document.getElementById("timingSet");
const timingUp = document.getElementById("timingUp");
const timingDown = document.getElementById("timingDown");

const fontSet = document.getElementById("fontSet");
const fontUp = document.getElementById("fontUp");
const fontDown = document.getElementById("fontDown");

const linesSet = document.getElementById("linesSet");

const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
const backBtn = document.getElementById("backBtn");
const forwardBtn = document.getElementById("forwardBtn");
const fsBtn = document.getElementById("fsBtn");

/* ================= STATE ================= */
const state = {
  timing:25,
  fontSize:1.6,
  linesToShow:15,
  lines:[],
  index:0,
  running:false,
  timer:null,
  wakeLock:null,
  title:"Chou's Teleprompter"
};

/* ================= URL PARAMS ================= */
(() => {
  const p = new URLSearchParams(location.search);
  if(p.get("timing")) state.timing = +p.get("timing");
  if(p.get("font")) state.fontSize = +p.get("font");
  if(p.get("lines")) state.linesToShow = +p.get("lines");
  if(p.get("text")) loadFromURL(p.get("text"));
  applyVisuals();
})();

/* ================= LOAD TEXT ================= */
function loadFromURL(url){
  fetch(url).then(r=>r.text()).then(t=>{
    setText(t,url);
    urlInput.classList.add("hidden");
  });
}

function setText(text,label){
  state.lines = text.split(/\r?\n/);
  state.index = 0;
  state.title = label;
  updateHeader();
  render();
}

/* ================= RENDER ================= */
function render(){
  viewer.innerHTML = "";

  const start = Math.max(0, state.index - 3);
  const end = Math.min(
    state.lines.length,
    start + state.linesToShow
  );

  for(let i = start; i < end; i++){
    const div = document.createElement("div");
    div.className = "line" + (i === state.index ? " active" : "");
    div.textContent = state.lines[i] || "";

    div.onclick = () => {
      state.index = i;
      render();
    };

    viewer.appendChild(div);
  }
}

/* ================= PLAY ================= */
function nextLine(){
  let next = state.index + 1;
  let pauseAfter = false;

  while(next < state.lines.length){
    const l = state.lines[next].trim();

    if(!l || l.startsWith("||") || l.startsWith("//") || l.startsWith("/*")){
      next++;
      continue;
    }

    if(l.startsWith("##")) pauseAfter = true;
    break;
  }

  state.index = Math.min(next, state.lines.length - 1);
  render();

  if(pauseAfter) setTimeout(pause,50);
}

function play(){
  if(state.running) return;
  state.running = true;
  playBtn.disabled = true;
  pauseBtn.disabled = false;
  requestWakeLock();
  state.timer = setInterval(nextLine, state.timing * 1000);
}

function pause(){
  state.running = false;
  clearInterval(state.timer);
  playBtn.disabled = false;
  pauseBtn.disabled = true;
  releaseWakeLock();
}

/* ================= EVENTS ================= */
playBtn.onclick = play;
pauseBtn.onclick = pause;

forwardBtn.onclick = () => {
  state.index = Math.min(
    state.lines.length - 1,
    state.index + state.linesToShow
  );
  render();
};

backBtn.onclick = () => {
  state.index = Math.max(
    0,
    state.index - state.linesToShow
  );
  render();
};

timingSet.onclick = () => {
  const v = prompt("Timing (s)", state.timing);
  if(v) setTiming(+v);
};
timingUp.onclick = () => setTiming(state.timing + 1);
timingDown.onclick = () => setTiming(state.timing - 1);

fontSet.onclick = () => {
  const v = prompt("Font size", state.fontSize);
  if(v) setFont(+v);
};
fontUp.onclick = () => setFont(state.fontSize + 0.1);
fontDown.onclick = () => setFont(state.fontSize - 0.1);

linesSet.onclick = () => {
  const v = prompt("Lines", state.linesToShow);
  if(v) setLines(+v);
};

btnLink.onclick = () => {
  urlInput.classList.toggle("hidden");
  urlInput.focus();
};

urlInput.onkeydown = e => {
  if(e.key === "Enter") loadFromURL(urlInput.value);
};

btnFile.onclick = () => fileInput.click();
fileInput.onchange = e =>
  e.target.files[0].text().then(t =>
    setText(t, e.target.files[0].name)
  );

/* ================= FULLSCREEN ================= */
fsBtn.onclick = () => {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
    document.body.classList.add("fullscreen");
  }else{
    document.exitFullscreen();
    document.body.classList.remove("fullscreen");
  }
};

/* ================= SETTERS ================= */
function setTiming(v){
  if(v < 1) return;
  state.timing = v;
  updateHeader();
  if(state.running){
    clearInterval(state.timer);
    state.timer = setInterval(nextLine, state.timing * 1000);
  }
}

function setFont(v){
  if(v < 0.5) return;
  state.fontSize = v;
  applyVisuals();
}

function setLines(v){
  if(v < 4) return;
  state.linesToShow = v;
  render();
}

/* ================= VISUAL ================= */
function applyVisuals(){
  document.documentElement.style.setProperty("--font-size", state.fontSize + "rem");
  updateHeader();
}

function updateHeader(){
  header.textContent =
    state.title.substring(0,32) + " | " +
    state.timing + "s";
}

/* ================= WAKE LOCK ================= */
async function requestWakeLock(){
  try{
    state.wakeLock = await navigator.wakeLock.request("screen");
  }catch{}
}

function releaseWakeLock(){
  if(state.wakeLock){
    state.wakeLock.release();
    state.wakeLock = null;
  }
}
</script>

</body>
</html>
