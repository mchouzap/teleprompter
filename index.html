<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root{ --font-size:1.6rem; --blue:#1e88e5 }

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

header{
  padding:6px 10px;
  background:#0d47a1;
  font-size:.85rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
}

.controls{
  background:#111;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row{
  display:flex;
  gap:6px;
  width:100%;
}

button,input{
  height:36px;
  border:none;
  font-size:.95rem;
}

button{
  background:var(--blue);
  color:#fff;
  flex:1;
}

button:disabled{ opacity:.4 }

input{
  background:#fff;
  color:#000;
  flex:3;
}

#viewer{
  flex:1;
  padding:12px;
  font-size:var(--font-size);
  line-height:1.4;
  overflow:hidden;
}

.line{ opacity:.45 }
.active{ opacity:1;background:#fff;color:#000 }

.hidden{ display:none }
</style>
</head>

<body>

<!-- FILA 1 -->
<div class="row">
  <header id="header">Chou's Teleprompter</header>
  <button id="loadFile">📂</button>
  <button id="showUrl">🔗</button>
</div>

<div class="row hidden" id="urlRow">
  <input id="textUrl" placeholder="Pega URL .txt y presiona Enter">
</div>

<!-- FILA 2 -->
<div class="controls">
  <div class="row">
    <button id="timingSet">⏱</button>
    <button id="timingUp">⬆</button>
    <button id="timingDown">⬇</button>

    <button id="fontSet">A</button>
    <button id="fontUp">＋</button>
    <button id="fontDown">－</button>

    <button id="linesSet">≡</button>
  </div>

  <!-- FILA 3 -->
  <div class="row">
    <button id="play">▶</button>
    <button id="pause" disabled>⏸</button>
    <button id="back">⏮</button>
    <button id="forward">⏭</button>
    <button id="fullscreen">⛶</button>
  </div>
</div>

<div id="viewer"></div>

<input id="fileInput" type="file" accept=".txt" hidden>

<script>
/* ===== STATE ===== */
const state={
  timing:25,fontSize:1.6,linesToShow:15,
  lines:[],index:0,running:false,timer:null,
  wakeLock:null,title:"Chou's Teleprompter"
};

/* ===== INIT URL PARAMS ===== */
(()=>{
  const p=new URLSearchParams(location.search);
  if(p.get("timing")) state.timing=parseInt(p.get("timing"));
  if(p.get("font")) state.fontSize=parseFloat(p.get("font"));
  if(p.get("lines")) state.linesToShow=parseInt(p.get("lines"));
  if(p.get("text")) loadFromURL(p.get("text"));
  applyVisuals();
})();

/* ===== LOAD TEXT ===== */
function loadFromURL(url){
  fetch(url).then(r=>r.text()).then(t=>{
    setText(t,url);
    hideUrlInput();
  });
}

function setText(text,label){
  state.lines=text.split(/\r?\n/);
  state.index=0;
  state.title=label;
  updateHeader();
  render();
}

/* ===== URL INPUT ===== */
showUrl.onclick=()=>{
  urlRow.classList.toggle("hidden");
  textUrl.focus();
};
textUrl.onkeydown=e=>{
  if(e.key==="Enter" && textUrl.value){
    loadFromURL(textUrl.value.trim());
  }
};
function hideUrlInput(){
  urlRow.classList.add("hidden");
  textUrl.value="";
}

/* ===== FILE ===== */
loadFile.onclick=()=>fileInput.click();
fileInput.onchange=e=>{
  const f=e.target.files[0];
  if(f) f.text().then(t=>setText(t,f.name));
};

/* ===== RENDER ===== */
function render(){
  viewer.innerHTML=state.lines
    .slice(state.index,state.index+state.linesToShow)
    .map((l,i)=>`<div class="line ${i===0?'active':''}">${l}</div>`)
    .join("");
}

/* ===== PLAYBACK ===== */
function nextLine(){
  let next=state.index+1, pauseAfter=false;
  while(next<state.lines.length){
    const l=state.lines[next].trim();
    if(l===""||l.startsWith("||")||l.startsWith("//")||l.startsWith("/*")){
      next++;continue;
    }
    if(l.startsWith("##")) pauseAfter=true;
    break;
  }
  state.index=next;
  render();
  if(pauseAfter) setTimeout(pause,50);
}

function play(){
  if(state.running) return;
  state.running=true;
  play.disabled=true;
  pause.disabled=false;
  requestWakeLock();
  state.timer=setInterval(nextLine,state.timing*1000);
}
function pause(){
  state.running=false;
  clearInterval(state.timer);
  play.disabled = false;
  pause.disabled = true;
  releaseWakeLock();
}

/* ===== BUTTONS ===== */
play.onclick=play;
pause.onclick=pause;
back.onclick=()=>{state.index=Math.max(0,state.index-1);render()};
forward.onclick=()=>{state.index++;render()};

timingUp.onclick=()=>setTiming(state.timing+1);
timingDown.onclick=()=>setTiming(state.timing-1);
timingSet.onclick=()=>{const v=prompt("Timing",state.timing);if(v)setTiming(+v);};

fontUp.onclick=()=>setFont(state.fontSize+.1);
fontDown.onclick=()=>setFont(state.fontSize-.1);
fontSet.onclick=()=>{const v=prompt("Fuente",state.fontSize);if(v)setFont(+v);};

linesSet.onclick=()=>{const v=prompt("Líneas",state.linesToShow);if(v)setLines(+v);};

fullscreen.onclick=()=>{
  document.fullscreenElement?
    document.exitFullscreen():
    document.documentElement.requestFullscreen();
};

/* ===== SETTERS ===== */
function setTiming(v){
  if(v<1) return;
  state.timing=v;updateHeader();
  if(state.running){
    clearInterval(state.timer);
    state.timer=setInterval(nextLine,state.timing*1000);
  }
}
function setFont(v){
  if(v<.5) return;
  state.fontSize=v;applyVisuals();
}
function setLines(v){
  if(v<1) return;
  state.linesToShow=v;render();
}

/* ===== VISUAL ===== */
function applyVisuals(){
  document.documentElement.style.setProperty("--font-size",state.fontSize+"rem");
  updateHeader();
}
function updateHeader(){
  header.textContent=`${state.title.substring(0,32)} | ${state.timing}s`;
}

/* ===== WAKE LOCK ===== */
async function requestWakeLock(){
  try{state.wakeLock=await navigator.wakeLock.request("screen");}catch{}
}
function releaseWakeLock(){
  if(state.wakeLock){state.wakeLock.release();state.wakeLock=null;}
}
</script>

</body>
</html>
