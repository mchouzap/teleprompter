<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter by Chou</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

#progress {
  height: 4px;
  background: #1e88e5;
  width: 0%;
  transition: width 0.1s linear;
}

#text {
  flex: 1;
  padding: 0.8rem 1rem;
  font-size: 1.3rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow: hidden;
}

.line {
  padding: 0.1rem 0;
}

.highlight {
  background: rgba(30,136,229,0.3);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.5rem;
  background: #111;
}

.controls input,
.controls button {
  flex: 1 1 30%;
  padding: 0.6rem;
  font-size: 1rem;
  border-radius: 6px;
  border: none;
}

button:enabled {
  background: #1e88e5;
  color: #fff;
}

button:disabled {
  background: #333;
  color: #777;
}

.hide-ui .controls {
  display: none;
}
</style>
</head>

<body>

<div id="progress"></div>
<div id="text">Carga un texto ya sea mediante una url o el archivo para comenzar…</div>

<div class="controls">
  <input id="textUrl" placeholder="URL del texto (.txt)">
  <input id="timingInput" type="number" min="1" value="7">
  <input id="fileInput" type="file" accept=".txt">
  <button id="load">Cargar</button>

  <button id="prev">⏮</button>
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="next">⏭</button>

  <button id="mirror">🔁</button>
  <button id="toggleUI">👁️</button>
  <button id="broadcast">📡</button>
</div>

<script>
let pages = [];
let currentPage = 0;
let currentLine = 0;
let timer = null;
let lineTimer = null;
let timing = 7;
let broadcasting = false;

const textDiv = document.getElementById("text");
const progress = document.getElementById("progress");
const pauseBtn = document.getElementById("pause");

function enterFullscreen() {
  document.documentElement.requestFullscreen?.();
}
function exitFullscreen() {
  document.exitFullscreen?.();
}

function splitPages(text) {
  const lines = text.split(/\r?\n+/);
  const perPage = 15;
  const result = [];
  for (let i = 0; i < lines.length; i += perPage) {
    result.push(lines.slice(i, i + perPage));
  }
  return result;
}

function renderPage() {
  currentLine = 0;
  textDiv.innerHTML = pages[currentPage]
    .map((l, i) =>
      `<div class="line ${i === 0 ? "highlight" : ""}">${l}</div>`
    ).join("");
  progress.style.width = "0%";
}

function advanceLine() {
  const lines = document.querySelectorAll(".line");
  if (currentLine < lines.length - 1) {
    lines[currentLine].classList.remove("highlight");
    currentLine++;
    lines[currentLine].classList.add("highlight");
  }
}

function start() {
  if (timer || !pages.length) return;
  pauseBtn.disabled = false;
  enterFullscreen();

  const linesCount = pages[currentPage].length;
  const lineDuration = (timing * 1000) / linesCount;
  let elapsed = 0;

  lineTimer = setInterval(() => {
    advanceLine();
  }, lineDuration);

  timer = setInterval(() => {
    currentPage < pages.length - 1 ? currentPage++ : stop();
    renderPage();
    clearInterval(lineTimer);
    start();
  }, timing * 1000);

  const progressInterval = setInterval(() => {
    elapsed += 100;
    progress.style.width = `${(elapsed / (timing * 1000)) * 100}%`;
    if (!timer) clearInterval(progressInterval);
  }, 100);
}

function stop() {
  clearInterval(timer);
  clearInterval(lineTimer);
  timer = null;
  pauseBtn.disabled = true;
  if (!broadcasting) exitFullscreen();
}

play.onclick = start;
pause.onclick = stop;

next.onclick = () => {
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage();
  }
};

prev.onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
  }
};

load.onclick = async () => {
  stop();
  timing = parseInt(timingInput.value) || 7;
  let txt = "";

  if (fileInput.files[0]) {
    txt = await fileInput.files[0].text();
  } else if (textUrl.value) {
    const res = await fetch(textUrl.value);
    txt = await res.text();
  } else return;

  pages = splitPages(txt.replace(/\r/g, ""));
  currentPage = 0;
  renderPage();
};

mirror.onclick = () => {
  textDiv.style.transform =
    textDiv.style.transform ? "" : "scaleX(-1)";
};

toggleUI.onclick = () => {
  document.body.classList.toggle("hide-ui");
};

broadcast.onclick = () => {
  broadcasting = !broadcasting;
  document.body.classList.toggle("hide-ui", broadcasting);
  broadcasting ? enterFullscreen() : exitFullscreen();
};
</script>

</body>
</html>
