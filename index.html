<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root {
  --font-size: 1.25rem;
  --btn-h: 32px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* HEADER */
#header {
  background: #111;
  padding: 6px 10px;
  font-size: 0.85rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* CONTROLS */
.controls {
  display: grid;
  gap: 6px;
  padding: 6px;
  background: #111;
}

.controls.top {
  grid-template-columns:
    1fr 1fr
    1fr 0.5fr 0.5fr
    1fr 0.5fr 0.5fr;
}

.controls.bottom {
  grid-template-columns: repeat(5, 1fr);
}

button {
  height: var(--btn-h);
  border-radius: 6px;
  border: none;
  background: #1e88e5;
  color: #fff;
  font-size: 1rem;
}

button:disabled {
  background: #333;
  color: #777;
}

/* TEXT */
#textWrapper {
  flex: 1;
  overflow: hidden;
  position: relative;
}

#tempo {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
}

.pulse {
  background: #1e88e5;
}

#text {
  padding: 1vh 4vw;
  font-size: var(--font-size);
  line-height: 1.55;
  white-space: pre-wrap;
}

.line {
  padding: 0.12em 0;
}

/* HIGHLIGHT */
.highlight {
  background: rgba(255,255,255,0.2);
  border-left: 4px solid #1e88e5;
  padding-left: 0.6em;
  box-shadow: 0 0 10px rgba(30,136,229,0.7);
}
</style>
</head>

<body>
<div id="app">

<div id="header">
  Para comenzar agrega un texto vía URL o carga el archivo *.txt
</div>

<!-- TOP CONTROLS -->
<div class="controls top">
  <button id="folder">📁</button>
  <button id="linkBtn">🔗</button>

  <button id="timingBtn">⏱</button>
  <button id="timingPlus">➕</button>
  <button id="timingMinus">➖</button>

  <button id="fontBtn">🔤</button>
  <button id="fontPlus">➕</button>
  <button id="fontMinus">➖</button>
</div>

<!-- BOTTOM CONTROLS -->
<div class="controls bottom">
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <button id="fullscreen">⤢</button>
</div>

<div id="textWrapper">
  <div id="tempo"></div>
  <div id="text">Chou’s Teleprompter</div>
</div>

<input id="fileInput" type="file" accept=".txt" hidden>

</div>

<script>
let pages = [];
let currentPage = 0;
let currentLine = 0;

let timer = null;
let lineTimer = null;
let tempoTimer = null;

let timing = 25;        // DEFAULT
let fontSize = 1.25;
let sourceName = "";
let wakeLock = null;

/* UTILITIES */
function truncate(text, max = 32) {
  return text.length > max ? text.slice(0, max - 1) + "…" : text;
}

function isSkippable(line) {
  const t = line.trim();
  return (
    !t ||
    t.startsWith("||") ||
    t.startsWith("//") ||
    t.startsWith("/*") ||
    t.startsWith("##")
  );
}

function isPauseLine(line) {
  return line.trim().startsWith("##");
}

/* HEADER */
function updateHeader() {
  if (!sourceName) return;
  header.textContent = `${truncate(sourceName)} | ⏱ ${timing}s`;
}

/* PAGINATION */
function splitPages(text) {
  const lines = text.split(/\r?\n/);
  const out = [];
  for (let i = 0; i < lines.length; i += 16)
    out.push(lines.slice(i, i + 16));
  return out;
}

/* RENDER */
function renderPage() {
  currentLine = 0;
  text.innerHTML = pages[currentPage]
    .map(l => `<div class="line">${l}</div>`)
    .join("");
  advanceToNextValidLine();
}

function advanceToNextValidLine() {
  const lines = document.querySelectorAll(".line");

  while (currentLine < lines.length) {
    const txt = lines[currentLine].textContent;

    if (isPauseLine(txt)) {
      lines[currentLine].classList.add("highlight");
      pause.click();
      return;
    }

    if (!isSkippable(txt)) {
      lines[currentLine].classList.add("highlight");
      return;
    }

    currentLine++;
  }
}

/* TEMPO */
function startTempo() {
  tempoTimer = setInterval(() => {
    tempo.classList.add("pulse");
    setTimeout(() => tempo.classList.remove("pulse"), 120);
  }, 1000 / timing);
}

function stopTempo() {
  clearInterval(tempoTimer);
}

/* WAKE LOCK */
async function enableWakeLock() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
function disableWakeLock() {
  wakeLock?.release();
  wakeLock = null;
}

/* PLAYBACK */
function restartIfRunning() {
  if (timer) {
    pause.click();
    play.click();
  }
}

play.onclick = async () => {
  if (timer || !pages.length) return;

  pause.disabled = false;
  await enableWakeLock();
  startTempo();

  const validLines =
    pages[currentPage].filter(l => !isSkippable(l)).length || 1;

  const lineDuration = (timing * 1000) / validLines;

  lineTimer = setInterval(() => {
    const lines = document.querySelectorAll(".line");
    lines[currentLine]?.classList.remove("highlight");
    currentLine++;
    advanceToNextValidLine();
  }, lineDuration);

  timer = setInterval(() => {
    if (++currentPage < pages.length) renderPage();
    else pause.click();
  }, timing * 1000);
};

pause.onclick = () => {
  clearInterval(timer);
  clearInterval(lineTimer);
  stopTempo();
  disableWakeLock();
  timer = null;
  pause.disabled = true;
};

/* NAV */
prev.onclick = () => currentPage > 0 && (currentPage--, renderPage());
next.onclick = () => currentPage < pages.length - 1 && (currentPage++, renderPage());

/* TIMING */
timingPlus.onclick = () => { timing++; updateHeader(); restartIfRunning(); };
timingMinus.onclick = () => { timing = Math.max(1, timing - 1); updateHeader(); restartIfRunning(); };
timingBtn.onclick = restartIfRunning;

/* FONT */
fontPlus.onclick = () => {
  fontSize = Math.min(3, fontSize + 0.1);
  document.documentElement.style.setProperty("--font-size", fontSize + "rem");
};
fontMinus.onclick = () => {
  fontSize = Math.max(0.8, fontSize - 0.1);
  document.documentElement.style.setProperty("--font-size", fontSize + "rem");
};

/* FULLSCREEN */
fullscreen.onclick = () =>
  document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen?.();

/* FILE */
folder.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files[0];
  const txt = await file.text();
  sourceName = file.name;
  pages = splitPages(txt);
  currentPage = 0;
  updateHeader();
  renderPage();
};

/* LINK */
linkBtn.onclick = async () => {
  const url = prompt("Pega URL .txt");
  if (!url) return;
  const txt = await (await fetch(url)).text();
  sourceName = url.replace(/^https?:\/\//, "");
  pages = splitPages(txt);
  currentPage = 0;
  updateHeader();
  renderPage();
};

/* URL PARAMS */
(function loadFromURL() {
  const p = new URLSearchParams(location.search);

  if (p.get("timing")) timing = parseInt(p.get("timing"));
  if (p.get("font")) {
    fontSize = parseFloat(p.get("font"));
    document.documentElement.style.setProperty("--font-size", fontSize + "rem");
  }
  if (p.get("text")) {
    fetch(p.get("text"))
      .then(r => r.text())
      .then(txt => {
        sourceName = p.get("text").replace(/^https?:\/\//, "");
        pages = splitPages(txt);
        updateHeader();
        renderPage();
      });
  }
})();
</script>
</body>
</html>
