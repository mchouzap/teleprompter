<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root { --font-size:1.25rem; --btn-h:32px; }
*{box-sizing:border-box;}

body{
  margin:0;background:#000;color:#fff;
  font-family:system-ui,sans-serif;
  height:100dvh;overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100%;}

#header{
  background:#111;padding:6px 10px;
  font-size:.85rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.controls{display:grid;gap:6px;padding:6px;background:#111;}
.controls.top{
  grid-template-columns:
    1fr 1fr
    .5fr .4fr .4fr
    .5fr .4fr .4fr
    .5fr .4fr .4fr;
}
.controls.bottom{grid-template-columns:repeat(5,1fr);}

button{
  height:var(--btn-h);
  border:none;border-radius:6px;
  background:#1e88e5;color:#fff;font-size:1rem;
}
button:disabled{background:#333;color:#777;}

#textWrapper{flex:1;overflow:hidden;position:relative;}
#tempo{
  position:absolute;top:6px;right:10px;
  width:8px;height:8px;border-radius:50%;
  background:#555;
}
.pulse{background:#1e88e5;}

#text{
  padding:1vh 4vw;
  font-size:var(--font-size);
  line-height:1.55;
  white-space:pre-wrap;
}
.line{padding:.12em 0;}
.highlight{
  background:rgba(255,255,255,.25);
  border-left:4px solid #1e88e5;
  padding-left:.6em;
  box-shadow:0 0 12px rgba(30,136,229,.8);
}
</style>
</head>

<body>
<div id="app">

<div id="header">
Para comenzar agrega un texto vía URL o carga el archivo *.txt
</div>

<div class="controls top">
  <button id="folder">📁</button>
  <button id="linkBtn">🔗</button>

  <button id="timingBtn">⏱</button>
  <button id="timingUp">⬆️</button>
  <button id="timingDown">⬇️</button>

  <button id="fontBtn">🔤</button>
  <button id="fontPlus">➕</button>
  <button id="fontMinus">➖</button>

  <button id="linesBtn">📄</button>
</div>

<div class="controls bottom">
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <button id="fullscreen">⤢</button>
</div>

<div id="textWrapper">
  <div id="tempo"></div>
  <div id="text">Chou’s Teleprompter</div>
</div>

<input id="fileInput" type="file" accept=".txt" hidden>
</div>

<script>
let pages=[],currentPage=0,currentLine=0;
let timer=null,lineTimer=null,tempoTimer=null;
let timing=25,fontSize=1.25,linesPerPage=15;
let sourceName="",wakeLock=null;

const header=document.getElementById("header");
const text=document.getElementById("text");
const tempo=document.getElementById("tempo");

function truncate(t,m=32){return t.length>m?t.slice(0,m-1)+"…":t;}
function isSkippable(l){
  const t=l.trim();
  return !t||t.startsWith("||")||t.startsWith("//")||t.startsWith("/*");
}
function isPauseLine(l){return l.trim().startsWith("##");}

function updateHeader(){
  if(!sourceName)return;
  header.textContent=`${truncate(sourceName)} | ⏱ ${timing}s | 📄 ${linesPerPage}`;
}

function splitPages(txt){
  const l=txt.split(/\r?\n/),o=[];
  for(let i=0;i<l.length;i+=linesPerPage)o.push(l.slice(i,i+linesPerPage));
  return o;
}

function repaginate(){
  if(!sourceName)return;
  const all=pages.flat().join("\n");
  pages=splitPages(all);
  currentPage=Math.min(currentPage,pages.length-1);
  renderPage();
}

function renderPage(){
  currentLine=0;
  text.innerHTML=pages[currentPage].map(l=>`<div class="line">${l}</div>`).join("");
  advance();
}

function advance(){
  const ls=document.querySelectorAll(".line");
  while(currentLine<ls.length){
    const t=ls[currentLine].textContent;
    if(isPauseLine(t)){ls[currentLine].classList.add("highlight");pause.click();return;}
    if(!isSkippable(t)){ls[currentLine].classList.add("highlight");return;}
    currentLine++;
  }
}

function startTempo(){
  stopTempo();
  tempoTimer=setInterval(()=>{
    tempo.classList.add("pulse");
    setTimeout(()=>tempo.classList.remove("pulse"),120);
  },1000/timing);
}
function stopTempo(){clearInterval(tempoTimer);}

async function enableWakeLock(){try{wakeLock=await navigator.wakeLock.request("screen");}catch{}}
function disableWakeLock(){wakeLock?.release();wakeLock=null;}

function setTiming(v){timing=Math.max(1,v);updateHeader();restart();}
function setFont(v){
  fontSize=Math.min(3,Math.max(.8,v));
  document.documentElement.style.setProperty("--font-size",fontSize+"rem");
}
function setLines(v){linesPerPage=Math.max(5,Math.min(30,v));updateHeader();repaginate();}

function restart(){if(timer){pause.click();play.click();}}

play.onclick=async()=>{
  if(timer||!pages.length)return;
  pause.disabled=false;
  await enableWakeLock();
  startTempo();
  const valid=pages[currentPage].filter(l=>!isSkippable(l)).length||1;
  const d=(timing*1000)/valid;
  lineTimer=setInterval(()=>{
    const ls=document.querySelectorAll(".line");
    ls[currentLine]?.classList.remove("highlight");
    currentLine++;advance();
  },d);
  timer=setInterval(()=>{
    if(++currentPage<pages.length)renderPage();else pause.click();
  },timing*1000);
};

pause.onclick=()=>{
  clearInterval(timer);clearInterval(lineTimer);
  stopTempo();disableWakeLock();
  timer=null;pause.disabled=true;
};

prev.onclick=()=>currentPage>0&&(currentPage--,renderPage());
next.onclick=()=>currentPage<pages.length-1&&(currentPage++,renderPage());

timingUp.onclick=()=>setTiming(timing+1);
timingDown.onclick=()=>setTiming(timing-1);
timingBtn.onclick=restart;

fontPlus.onclick=()=>setFont(fontSize+.1);
fontMinus.onclick=()=>setFont(fontSize-.1);

linesPlus.onclick=()=>setLines(linesPerPage+1);
linesMinus.onclick=()=>setLines(linesPerPage-1);

fullscreen.onclick=()=>document.fullscreenElement?
  document.exitFullscreen():
  document.documentElement.requestFullscreen?.();

folder.onclick=()=>fileInput.click();
fileInput.onchange=async()=>{
  const f=fileInput.files[0];
  const t=await f.text();
  sourceName=f.name;pages=splitPages(t);
  currentPage=0;updateHeader();renderPage();
};

linkBtn.onclick=async()=>{
  const u=prompt("Pega URL .txt");
  if(!u)return;
  const t=await (await fetch(u)).text();
  sourceName=u.replace(/^https?:\/\//,"");
  pages=splitPages(t);
  currentPage=0;updateHeader();renderPage();
};

(function(){
  const p=new URLSearchParams(location.search);
  if(p.has("timing"))setTiming(+p.get("timing"));
  if(p.has("font"))setFont(+p.get("font"));
  if(p.has("lines"))setLines(+p.get("lines"));
  if(p.has("text")){
    fetch(p.get("text")).then(r=>r.text()).then(t=>{
      sourceName=p.get("text").replace(/^https?:\/\//,"");
      pages=splitPages(t);updateHeader();renderPage();
    });
  }
})();
</script>
</body>
</html>
