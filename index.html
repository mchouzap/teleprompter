<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root{
  --font-size: 1.6rem;
}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family: system-ui, sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

header{
  padding:8px 12px;
  font-size:0.9rem;
  background:#111;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#viewer{
  flex:1;
  padding:12px;
  font-size:var(--font-size);
  line-height:1.4;
  overflow:hidden;
}

.line{
  opacity:.5;
}
.active{
  opacity:1;
  background:#fff;
  color:#000;
}

.controls{
  background:#111;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row{
  display:flex;
  gap:4px;
}

input[type="text"], input[type="number"]{
  flex:1;
  height:36px;
}

button{
  height:36px;
  min-width:36px;
  background:#222;
  color:#fff;
  border:none;
  font-size:1rem;
}
button:disabled{
  opacity:.4;
}

.small{ flex:.5 }
</style>
</head>

<body>

<header id="header">
Para comenzar agrega un texto vía URL o carga el archivo *.txt
</header>

<div id="viewer"></div>

<div class="controls">

  <!-- INPUTS -->
  <div class="row">
    <input id="textUrl" type="text" placeholder="URL de texto (.txt)">
    <button id="loadUrl">🔗</button>
    <input id="fileInput" type="file" accept=".txt" hidden>
    <button id="loadFile">📂</button>
  </div>

  <!-- TIMING / FONT / LINES -->
  <div class="row">
    <button id="timingSet">⏱</button>
    <button id="timingUp" class="small">⬆</button>
    <button id="timingDown" class="small">⬇</button>

    <button id="fontSet">A</button>
    <button id="fontUp" class="small">＋</button>
    <button id="fontDown" class="small">－</button>

    <button id="linesSet">≡</button>
  </div>

  <!-- PLAYBACK -->
  <div class="row">
    <button id="play">▶</button>
    <button id="pause" disabled>⏸</button>
    <button id="back">⏮</button>
    <button id="forward">⏭</button>
    <button id="fullscreen">⛶</button>
  </div>

</div>

<script>
/* =======================
   STATE (single source)
======================= */
const state = {
  timing: 25,
  fontSize: 1.6,
  linesToShow: 15,
  lines: [],
  index: 0,
  running: false,
  timer: null,
  wakeLock: null
};

/* =======================
   ELEMENTS
======================= */
const viewer = document.getElementById("viewer");
const header = document.getElementById("header");

/* =======================
   URL PARAMS (INIT ONLY)
======================= */
(function loadFromURL(){
  const p = new URLSearchParams(location.search);

  if(p.get("timing")) state.timing = parseInt(p.get("timing")) || state.timing;
  if(p.get("font")) state.fontSize = parseFloat(p.get("font")) || state.fontSize;
  if(p.get("lines")) state.linesToShow = parseInt(p.get("lines")) || state.linesToShow;

  if(p.get("text")){
    document.getElementById("textUrl").value = p.get("text");
    loadTextFromURL(p.get("text"));
  }

  applyVisuals();
})();

/* =======================
   TEXT LOADING
======================= */
function loadTextFromURL(url){
  fetch(url)
    .then(r=>r.text())
    .then(t=>{
      setLines(t, url);
    })
    .catch(()=>alert("Error cargando texto"));
}

document.getElementById("loadUrl").onclick=()=>{
  const url = document.getElementById("textUrl").value.trim();
  if(url) loadTextFromURL(url);
};

document.getElementById("loadFile").onclick=()=>{
  document.getElementById("fileInput").click();
};

document.getElementById("fileInput").onchange=e=>{
  const f = e.target.files[0];
  if(!f) return;
  f.text().then(t=>setLines(t,f.name));
};

function setLines(text, label){
  state.lines = text.split(/\r?\n/);
  state.index = 0;
  updateHeader(label);
  render();
}

/* =======================
   RENDER
======================= */
function render(){
  const start = Math.max(0, state.index);
  const slice = state.lines.slice(start, start + state.linesToShow);

  viewer.innerHTML = slice.map((l,i)=>{
    const cls = i===0 ? "line active" : "line";
    return `<div class="${cls}">${l}</div>`;
  }).join("");
}

/* =======================
   PLAYBACK LOGIC
======================= */
function nextLine(){
  let next = state.index + 1;
  while(next < state.lines.length){
    const l = state.lines[next].trim();
    if(
      l==="" ||
      l.startsWith("||") ||
      l.startsWith("//") ||
      l.startsWith("/*")
    ){
      next++;
      continue;
    }
    if(l.startsWith("##")){
      pause();
      return;
    }
    break;
  }
  state.index = next;
  render();
}

function play(){
  if(state.running) return;
  state.running = true;
  document.getElementById("play").disabled = true;
  document.getElementById("pause").disabled = false;
  requestWakeLock();
  state.timer = setInterval(nextLine, state.timing * 1000);
}

function pause(){
  state.running = false;
  clearInterval(state.timer);
  releaseWakeLock();
  document.getElementById("play").disabled = false;
  document.getElementById("pause").disabled = true;
}

/* =======================
   BUTTONS
======================= */
document.getElementById("play").onclick=play;
document.getElementById("pause").onclick=pause;
document.getElementById("back").onclick=()=>{state.index=Math.max(0,state.index-1);render()};
document.getElementById("forward").onclick=()=>{state.index++;render()};

document.getElementById("timingUp").onclick=()=>setTiming(state.timing+1);
document.getElementById("timingDown").onclick=()=>setTiming(state.timing-1);

document.getElementById("fontUp").onclick=()=>setFont(state.fontSize+.1);
document.getElementById("fontDown").onclick=()=>setFont(state.fontSize-.1);

document.getElementById("timingSet").onclick=()=>{
  const v = prompt("Timing en segundos", state.timing);
  if(v) setTiming(parseInt(v));
};

document.getElementById("fontSet").onclick=()=>{
  const v = prompt("Tamaño de fuente", state.fontSize);
  if(v) setFont(parseFloat(v));
};

document.getElementById("linesSet").onclick=()=>{
  const v = prompt("Líneas a mostrar", state.linesToShow);
  if(v) setLinesCount(parseInt(v));
};

document.getElementById("fullscreen").onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

/* =======================
   SETTERS
======================= */
function setTiming(v){
  if(v<1) return;
  state.timing = v;
  updateHeader();
  if(state.running){
    clearInterval(state.timer);
    state.timer = setInterval(nextLine, state.timing * 1000);
  }
}

function setFont(v){
  if(v<0.5) return;
  state.fontSize = v;
  applyVisuals();
}

function setLinesCount(v){
  if(v<1) return;
  state.linesToShow = v;
  render();
}

/* =======================
   VISUAL / HEADER
======================= */
function applyVisuals(){
  document.documentElement.style.setProperty("--font-size", state.fontSize+"rem");
  updateHeader();
}

function updateHeader(label){
  let title = label || header.textContent;
  title = title.substring(0,32);
  header.textContent = `${title} | ${state.timing}s`;
}

/* =======================
   WAKE LOCK
======================= */
async function requestWakeLock(){
  try{
    state.wakeLock = await navigator.wakeLock.request("screen");
  }catch(e){}
}
function releaseWakeLock(){
  if(state.wakeLock){
    state.wakeLock.release();
    state.wakeLock=null;
  }
}
</script>

</body>
</html>
