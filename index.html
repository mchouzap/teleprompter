<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter</title>

<style>
:root {
  --btn-h: 32px;
  --font-size: min(4vw, 1.25rem);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ───────── TOP CONTROLS ───────── */
#topControls {
  display: grid;
  grid-template-columns: 1fr auto auto auto auto;
  gap: 6px;
  padding: 6px;
  background: #111;
}

#topControls input,
#topControls button {
  height: var(--btn-h);
  font-size: 0.9rem;
  border-radius: 6px;
  border: none;
}

#topControls input {
  padding: 0 8px;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#topControls button {
  background: #1e88e5;
  color: #fff;
}

/* ───────── TEXT AREA ───────── */
#textWrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#progress {
  height: 3px;
  background: #1e88e5;
  width: 0%;
}

#tempo {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
  z-index: 10;
}

.pulse {
  background: #1e88e5;
}

#text {
  padding: 1vh 4vw;
  font-size: var(--font-size);
  line-height: 1.55;
  white-space: pre-wrap;
  overflow: hidden;
}

.line {
  padding: 0.08em 0;
}

.highlight
