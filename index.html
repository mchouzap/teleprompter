<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.inputs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.5rem;
  background: #111;
}

.inputs input,
.inputs button {
  flex: 1 1 100%;
  max-width: 100%;
  box-sizing: border-box;
  padding: 0.6rem;
  font-size: 0.95rem;
  border-radius: 6px;
  border: none;
}

#fileInput {
  color: #aaa;
}

#text {
  flex: 1;
  padding: 1rem;
  font-size: 1.3rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow: hidden;
}

.controls {
  display: flex;
  gap: 0.4rem;
  padding: 0.5rem;
  background: #111;
}

.controls button {
  flex: 1;
  font-size: 1.2rem;
  padding: 0.7rem;
  border: none;
  border-radius: 6px;
}

button:enabled {
  background: #1e88e5;
  color: white;
}

button:disabled {
  background: #333;
  color: #777;
}
</style>
</head>
