<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root{
  --font-size: 1.6rem;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family: system-ui, sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

header{
  padding:6px 10px;
  background:#111;
  font-size:.85rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ===== FRAME DE CONTROLES ===== */
#controls-frame{
  padding:6px;
  background:#111;
}

/* puedes cambiar SOLO este ancho */
.controls{
  max-width:520px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row{
  display:flex;
  gap:4px;
}

button,input{
  height:34px;
  background:#222;
  color:#fff;
  border:none;
  font-size:.95rem;
}

input{
  flex:1;
}

.small{ flex:.5 }

button:disabled{ opacity:.4 }

/* ===== VISOR ===== */
#viewer{
  flex:1;
  padding:12px;
  font-size:var(--font-size);
  line-height:1.4;
  overflow:hidden;
}

.line{ opacity:.45 }
.active{
  opacity:1;
  background:#fff;
  color:#000;
}
</style>
</head>

<body>

<header id="header">
Para comenzar agrega un texto vía URL o carga el archivo *.txt
</header>

<!-- CONTROLES ARRIBA -->
<div id="controls-frame">
  <div class="controls">

    <div class="row">
      <input id="textUrl" placeholder="URL texto (.txt)">
      <button id="loadUrl">🔗</button>
      <input id="fileInput" type="file" accept=".txt" hidden>
      <button id="loadFile">📂</button>
    </div>

    <div class="row">
      <button id="timingSet" class="small">⏱</button>
      <button id="timingUp" class="small">⬆</button>
      <button id="timingDown" class="small">⬇</button>

      <button id="fontSet" class="small">A</button>
      <button id="fontUp" class="small">＋</button>
      <button id="fontDown" class="small">－</button>

      <button id="linesSet">≡</button>
    </div>

    <div class="row">
      <button id="play">▶</button>
      <button id="pause" disabled>⏸</button>
      <button id="back">⏮</button>
      <button id="forward">⏭</button>
      <button id="fullscreen">⛶</button>
    </div>

  </div>
</div>

<div id="viewer"></div>

<script>
/* ================= STATE ================= */
const state={
  timing:25,
  fontSize:1.6,
  linesToShow:15,
  lines:[],
  index:0,
  running:false,
  timer:null,
  wakeLock:null
};

/* ================= INIT FROM URL ================= */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get("timing")) state.timing=parseInt(p.get("timing"))||state.timing;
  if(p.get("font")) state.fontSize=parseFloat(p.get("font"))||state.fontSize;
  if(p.get("lines")) state.linesToShow=parseInt(p.get("lines"))||state.linesToShow;
  if(p.get("text")){
    document.getElementById("textUrl").value=p.get("text");
    loadFromURL(p.get("text"));
  }
  applyVisuals();
})();

/* ================= TEXT LOAD ================= */
function loadFromURL(url){
  fetch(url).then(r=>r.text()).then(t=>setText(t,url));
}
document.getElementById("loadUrl").onclick=()=>{
  const u=textUrl.value.trim();
  if(u) loadFromURL(u);
};
document.getElementById("loadFile").onclick=()=>fileInput.click();
fileInput.onchange=e=>{
  const f=e.target.files[0];
  if(f) f.text().then(t=>setText(t,f.name));
};

function setText(text,label){
  state.lines=text.split(/\r?\n/);
  state.index=0;
  updateHeader(label);
  render();
}

/* ================= RENDER ================= */
function render(){
  const slice=state.lines.slice(state.index,state.index+state.linesToShow);
  viewer.innerHTML=slice.map((l,i)=>{
    return `<div class="line ${i===0?'active':''}">${l}</div>`;
  }).join("");
}

/* ================= PLAYBACK ================= */
function nextLine(){
  let next=state.index+1;
  let pauseAfter=false;

  while(next<state.lines.length){
    const l=state.lines[next].trim();
    if(l===""||l.startsWith("||")||l.startsWith("//")||l.startsWith("/*")){
      next++; continue;
    }
    if(l.startsWith("##")) pauseAfter=true;
    break;
  }

  state.index=next;
  render();

  if(pauseAfter){
    setTimeout(pause, 50); // deja que se vea el highlight
  }
}

function play(){
  if(state.running) return;
  state.running=true;
  playBtn.disabled=true;
  pauseBtn.disabled=false;
  requestWakeLock();
  state.timer=setInterval(nextLine,state.timing*1000);
}
function pause(){
  state.running=false;
  clearInterval(state.timer);
  playBtn.disabled=false;
  pauseBtn.disabled=true;
  releaseWakeLock();
}

/* ================= CONTROLS ================= */
play.onclick=play;
pause.onclick=pause;
back.onclick=()=>{state.index=Math.max(0,state.index-1);render()};
forward.onclick=()=>{state.index++;render()};

timingUp.onclick=()=>setTiming(state.timing+1);
timingDown.onclick=()=>setTiming(state.timing-1);

fontUp.onclick=()=>setFont(state.fontSize+.1);
fontDown.onclick=()=>setFont(state.fontSize-.1);

timingSet.onclick=()=>{
  const v=prompt("Timing (s)",state.timing);
  if(v) setTiming(parseInt(v));
};
fontSet.onclick=()=>{
  const v=prompt("Fuente",state.fontSize);
  if(v) setFont(parseFloat(v));
};
linesSet.onclick=()=>{
  const v=prompt("Líneas",state.linesToShow);
  if(v) setLines(parseInt(v));
};

fullscreen.onclick=()=>{
  document.fullscreenElement?
    document.exitFullscreen():
    document.documentElement.requestFullscreen();
};

/* ================= SETTERS ================= */
function setTiming(v){
  if(v<1) return;
  state.timing=v;
  updateHeader();
  if(state.running){
    clearInterval(state.timer);
    state.timer=setInterval(nextLine,state.timing*1000);
  }
}
function setFont(v){
  if(v<.5) return;
  state.fontSize=v;
  applyVisuals();
}
function setLines(v){
  if(v<1) return;
  state.linesToShow=v;
  render();
}

/* ================= VISUAL ================= */
function applyVisuals(){
  document.documentElement.style.setProperty("--font-size",state.fontSize+"rem");
  updateHeader();
}
function updateHeader(label){
  const t=(label||header.textContent).substring(0,32);
  header.textContent=`${t} | ${state.timing}s`;
}

/* ================= WAKE LOCK ================= */
async function requestWakeLock(){
  try{state.wakeLock=await navigator.wakeLock.request("screen");}catch(e){}
}
function releaseWakeLock(){
  if(state.wakeLock){state.wakeLock.release();state.wakeLock=null;}
}
</script>

</body>
</html>
