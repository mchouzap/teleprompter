<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teleprompter</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #text {
    flex: 1;
    padding: 1rem;
    font-size: 1.4rem;
    line-height: 1.6;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  .controls {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem;
    background: #111;
  }

  button {
    flex: 1;
    font-size: 1rem;
    padding: 0.7rem;
    border: none;
    border-radius: 6px;
  }

  button:enabled {
    background: #1e88e5;
    color: white;
  }

  button:disabled {
    background: #333;
    color: #777;
  }
</style>
</head>

<body>

<div id="text">Cargando texto…</div>

<div class="controls">
  <button id="prev">◀</button>
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="next">▶</button>
</div>

<script>
let pages = [];
let currentPage = 0;
let timer = null;
let timing = 5;

const textDiv = document.getElementById("text");
const playBtn = document.getElementById("play");
const pauseBtn = document.getElementById("pause");

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    textUrl: p.get("text"),
    timing: parseInt(p.get("timing")) || 5
  };
}

function splitIntoPages(text) {
  const lines = text.split(/\r?\n+/);
  const pageSize = 6;
  const result = [];
  for (let i = 0; i < lines.length; i += pageSize) {
    result.push(lines.slice(i, i + pageSize).join("\n"));
  }
  return result;
}

function showPage() {
  textDiv.textContent = pages[currentPage] || "";
}

function start() {
  if (timer) return;
  pauseBtn.disabled = false;

  timer = setInterval(() => {
    if (currentPage < pages.length - 1) {
      currentPage++;
      showPage();
    } else {
      stop();
    }
  }, timing * 1000);
}

function stop() {
  clearInterval(timer);
  timer = null;
  pauseBtn.disabled = true;
}

document.getElementById("next").onclick = () => {
  if (currentPage < pages.length - 1) {
    currentPage++;
    showPage();
  }
};

document.getElementById("prev").onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    showPage();
  }
};

playBtn.onclick = start;
pauseBtn.onclick = stop;

async function loadText() {
  const params = getParams();
  timing = params.timing;

  if (!params.textUrl) {
    textDiv.textContent = "No se proporcionó URL de texto.";
    return;
  }

  try {
    const res = await fetch(params.textUrl);
    const txt = await res.text();
    pages = splitIntoPages(txt.replace(/\r/g, ""));
    showPage();
  } catch {
    textDiv.textContent = "Error cargando el texto.";
  }
}

loadText();
</script>

</body>
</html>
