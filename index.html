<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter</title>

<style>
:root {
  --btn-h: 42px;
  --font-size: min(4.2vw, 1.35rem);
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

#progress {
  height: 3px;
  background: #1e88e5;
  width: 0%;
}

#tempo {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #555;
}

.pulse {
  background: #1e88e5;
}

#text {
  flex: 1;
  padding: 1vh 4vw;
  font-size: var(--font-size);
  line-height: 1.55;
  white-space: pre-wrap;
  overflow: hidden;
}

.line {
  padding: 0.1em 0;
}

.highlight {
  background: rgba(30,136,229,0.3);
}

/* CONTROLES */
.controls {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  padding: 6px;
  background: #111;
}

.controls input,
.controls button {
  height: var(--btn-h);
  font-size: 1rem;
  border-radius: 6px;
  border: none;
}

.controls input {
  grid-column: span 2;
  padding: 0 8px;
}

.controls button {
  background: #1e88e5;
  color: #fff;
}

button:disabled {
  background: #333;
  color: #777;
}

.icon {
  font-size: 1.2rem;
}
</style>
</head>

<body>

<div id="tempo"></div>
<div id="progress"></div>

<div id="text">Carga un texto para comenzar…</div>

<div class="controls">
  <input id="textUrl" placeholder="URL .txt">
  <input id="timingInput" type="number" min="1" value="7">

  <button id="load" class="icon">📂</button>
  <input id="fileInput" type="file" accept=".txt" hidden>

  <button id="play" class="icon">▶</button>
  <button id="pause" class="icon" disabled>⏸</button>
  <button id="prev" class="icon">⏮⏮</button>
  <button id="next" class="icon">⏭⏭</button>
  <button id="fullscreen" class="icon">⤢</button>
</div>

<script>
let pages = [];
let currentPage = 0;
let currentLine = 0;
let timer = null;
let lineTimer = null;
let tempoTimer = null;
