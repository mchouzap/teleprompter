<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root {
  --font-size: 1.25rem;
  --btn-h: 32px;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,sans-serif;
  height:100dvh;
  overflow:hidden;
}

#app{display:flex;flex-direction:column;height:100%}

#header{
  background:#111;
  padding:6px 10px;
  font-size:.85rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.controls{
  display:grid;
  gap:6px;
  padding:6px;
  background:#111;
}

.controls.top{
  grid-template-columns:
    1fr 1fr
    1fr .5fr .5fr
    1fr .5fr .5fr
    1fr;
}

.controls.bottom{
  grid-template-columns:repeat(5,1fr);
}

button{
  height:var(--btn-h);
  border:none;
  border-radius:6px;
  background:#1e88e5;
  color:#fff;
  font-size:1rem;
}

button:disabled{
  background:#333;
  color:#777;
}

#textWrapper{
  flex:1;
  position:relative;
  overflow:hidden;
}

#tempo{
  position:absolute;
  top:6px;
  right:10px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#555;
}
.pulse{background:#1e88e5}

#text{
  padding:1vh 4vw;
  font-size:var(--font-size);
  line-height:1.55;
  white-space:pre-wrap;
}

.line{padding:.12em 0}

.highlight{
  background:rgba(255,255,255,.3);
  border-left:4px solid #1e88e5;
  padding-left:.6em;
  box-shadow:0 0 14px rgba(30,136,229,.9);
}
</style>
</head>

<body>
<div id="app">

<div id="header">
Para comenzar agrega un texto vía URL o carga el archivo *.txt
</div>

<div class="controls top">
  <button id="folder">📁</button>
  <button id="linkBtn">🔗</button>

  <button id="timingBtn">⏱</button>
  <button id="timingUp">⬆️</button>
  <button id="timingDown">⬇️</button>

  <button id="fontBtn">🔤</button>
  <button id="fontPlus">➕</button>
  <button id="fontMinus">➖</button>

  <button id="linesBtn" disabled>📄</button>
</div>

<div class="controls bottom">
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <button id="fullscreen">⤢</button>
</div>

<div id="textWrapper">
  <div id="tempo"></div>
  <div id="text">Chou’s Teleprompter</div>
</div>

<input id="fileInput" type="file" accept=".txt" hidden>

</div>

<script>
/* ========== STATE ========== */
let pages=[];
let currentPage=0;
let currentLine=0;

let pageTimer=null;
let lineTimer=null;
let tempoTimer=null;

let timing=25;
let fontSize=1.25;
let linesPerPage=15;

let sourceName="";

/* ========== DOM ========== */
const header=document.getElementById("header");
const textEl=document.getElementById("text");
const tempo=document.getElementById("tempo");

const playBtn=document.getElementById("play");
const pauseBtn=document.getElementById("pause");

/* ========== HELPERS ========== */
const truncate=(t,m=32)=>t.length>m?t.slice(0,m-1)+"…":t;

const isSkippable=l=>{
  const t=l.trim();
  return !t||t.startsWith("||")||t.startsWith("//")||t.startsWith("/*");
};

const isPauseLine=l=>l.trim().startsWith("##");

/* ========== HEADER ========== */
function updateHeader(){
  if(!sourceName) return;
  header.textContent=`${truncate(sourceName)} | ⏱ ${timing}s | 📄 ${linesPerPage}`;
}

/* ========== PAGINATION ========== */
function splitPages(txt){
  const lines=txt.split(/\r?\n/);
  const out=[];
  for(let i=0;i<lines.length;i+=linesPerPage){
    out.push(lines.slice(i,i+linesPerPage));
  }
  return out;
}

function repaginate(){
  if(!pages.length) return;
  const all=pages.flat().join("\n");
  pages=splitPages(all);
  currentPage=Math.min(currentPage,pages.length-1);
  renderPage();
}

/* ========== RENDER ========== */
function renderPage(){
  currentLine=0;
  textEl.innerHTML=pages[currentPage]
    .map(l=>`<div class="line">${l}</div>`).join("");
  advanceLine();
}

function advanceLine(){
  const lines=document.querySelectorAll(".line");
  while(currentLine<lines.length){
    const t=lines[currentLine].textContent;
    if(isPauseLine(t)){
      lines[currentLine].classList.add("highlight");
      pause();
      return;
    }
    if(!isSkippable(t)){
      lines[currentLine].classList.add("highlight");
      return;
    }
    currentLine++;
  }
}

/* ========== TEMPO ========== */
function startTempo(){
  stopTempo();
  tempoTimer=setInterval(()=>{
    tempo.classList.add("pulse");
    setTimeout(()=>tempo.classList.remove("pulse"),120);
  },1000/timing);
}
function stopTempo(){clearInterval(tempoTimer);}

/* ========== PLAYBACK ========== */
function restartPlayback(){
  if(pageTimer){
    pause();
    play();
  }
}

function play(){
  if(pageTimer||!pages.length) return;
  pauseBtn.disabled=false;
  startTempo();

  const valid=pages[currentPage].filter(l=>!isSkippable(l)).length||1;
  const perLine=(timing*1000)/valid;

  lineTimer=setInterval(()=>{
    const lines=document.querySelectorAll(".line");
    lines[currentLine]?.classList.remove("highlight");
    currentLine++;
    advanceLine();
  },perLine);

  pageTimer=setInterval(()=>{
    currentPage++;
    if(currentPage>=pages.length){pause();return;}
    renderPage();
  },timing*1000);
}

function pause(){
  clearInterval(pageTimer);
  clearInterval(lineTimer);
  stopTempo();
  pageTimer=null;
  pauseBtn.disabled=true;
}

/* ========== SETTERS ========== */
function setTiming(v){
  timing=Math.max(1,v);
  updateHeader();
  restartPlayback();
}

function setFont(v){
  fontSize=Math.min(3,Math.max(.8,v));
  document.documentElement
    .style.setProperty("--font-size",fontSize+"rem");
}

function setLines(v){
  linesPerPage=Math.max(5,Math.min(30,v));
  updateHeader();
  repaginate();
  restartPlayback();
}

/* ========== CONTROLS ========== */
playBtn.onclick=play;
pauseBtn.onclick=pause;

prev.onclick=()=>currentPage>0&&(currentPage--,renderPage());
next.onclick=()=>currentPage<pages.length-1&&(currentPage++,renderPage());

timingUp.onclick=()=>setTiming(timing+1);
timingDown.onclick=()=>setTiming(timing-1);
timingBtn.onclick=restartPlayback;

fontPlus.onclick=()=>setFont(fontSize+.1);
fontMinus.onclick=()=>setFont(fontSize-.1);

fullscreen.onclick=()=>document.fullscreenElement
 ?document.exitFullscreen()
 :document.documentElement.requestFullscreen?.();

/* ========== INPUTS ========== */
folder.onclick=()=>fileInput.click();

fileInput.onchange=async()=>{
  const f=fileInput.files[0];
  const txt=await f.text();
  sourceName=f.name;
  pages=splitPages(txt);
  currentPage=0;
  updateHeader();
  renderPage();
};

linkBtn.onclick=async()=>{
  const url=prompt("Pega URL .txt");
  if(!url) return;
  const txt=await (await fetch(url)).text();
  sourceName=url.replace(/^https?:\/\//,"");
  pages=splitPages(txt);
  currentPage=0;
  updateHeader();
  renderPage();
};

/* ========== URL PARAMS ========== */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.has("timing")) timing=+p.get("timing");
  if(p.has("font")) fontSize=+p.get("font");
  if(p.has("lines")) linesPerPage=+p.get("lines");
  if(p.has("text")){
    fetch(p.get("text"))
      .then(r=>r.text())
      .then(txt=>{
        sourceName=p.get("text").replace(/^https?:\/\//,"");
        pages=splitPages(txt);
        updateHeader();
        renderPage();
      });
  }
  setFont(fontSize);
  updateHeader();
})();
</script>
</body>
</html>
