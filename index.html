<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter</title>

<style>
:root {
  --btn-h: 32px;
  --font-size: min(4vw, 1.25rem);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* HEADER */
#header {
  padding: 6px 10px;
  font-size: 0.85rem;
  background: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* CONTROLS */
#controls {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
  padding: 6px;
  background: #111;
}

#controls button {
  height: var(--btn-h);
  border-radius: 6px;
  border: none;
  background: #1e88e5;
  color: #fff;
  font-size: 1rem;
}

button:disabled {
  background: #333;
  color: #777;
}

/* INPUT OVERLAY */
#overlay {
  display: none;
  gap: 6px;
  padding: 6px;
  background: #111;
}

#overlay input {
  flex: 1;
  height: var(--btn-h);
  border-radius: 6px;
  border: none;
  padding: 0 8px;
}

/* TEXT */
#textWrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#tempo {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
}

.pulse { background: #1e88e5; }

#text {
  padding: 1vh 4vw;
  font-size: var(--font-size);
  line-height: 1.55;
  white-space: pre-wrap;
}

.line { padding: 0.08em 0; }
.highlight { background: rgba(30,136,229,0.28); }
</style>
</head>

<body>
<div id="app">

<div id="header">Sin texto cargado</div>

<div id="controls">
  <button id="folder">📁</button>
  <button id="linkBtn">🔗</button>
  <button id="timingBtn">⏱</button>
  <button id="plus">➕</button>
  <button id="minus">➖</button>
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <button id="fullscreen">⤢</button>
</div>

<div id="overlay">
  <input id="overlayInput">
  <button id="overlayOk">OK</button>
</div>

<div id="textWrapper">
  <div id="tempo"></div>
  <div id="text">Carga un texto para comenzar…</div>
</div>

<input id="fileInput" type="file" accept=".txt" hidden>

</div>

<script>
let pages = [];
let currentPage = 0;
let currentLine = 0;
let timer = null;
let lineTimer = null;
let tempoTimer = null;
let timing = 7;
let sourceName = "";

const textDiv = document.getElementById("text");
const header = document.getElementById("header");
const overlay = document.getElementById("overlay");
const overlayInput = document.getElementById("overlayInput");
const tempo = document.getElementById("tempo");

/* FULLSCREEN */
fullscreen.onclick = () =>
  document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen?.();

/* PAGINATION */
function splitPages(text) {
  const lines = text.split(/\r?\n+/);
  const out = [];
  for (let i = 0; i < lines.length; i += 12)
    out.push(lines.slice(i, i + 12));
  return out;
}

function renderPage() {
  currentLine = 0;
  textDiv.innerHTML = pages[currentPage]
    .map((l, i) => `<div class="line ${i === 0 ? "highlight" : ""}">${l}</div>`)
    .join("");
}

/* HEADER */
function updateHeader() {
  header.textContent = `${sourceName || "Texto"} | ⏱ ${timing}s`;
}

/* TEMPO */
function startTempo() {
  const interval = 1000 / timing;
  tempoTimer = setInterval(() => {
    tempo.classList.add("pulse");
    setTimeout(() => tempo.classList.remove("pulse"), 120);
  }, interval);
}

function stopTempo() {
  clearInterval(tempoTimer);
}

/* PLAY */
play.onclick = () => {
  if (timer || !pages.length) return;
  pause.disabled = false;
  startTempo();

  const lineDuration = (timing * 1000) / pages[currentPage].length;

  lineTimer = setInterval(() => {
    const lines = document.querySelectorAll(".line");
    if (currentLine < lines.length - 1) {
      lines[currentLine].classList.remove("highlight");
      currentLine++;
      lines[currentLine].classList.add("highlight");
    }
  }, lineDuration);

  timer = setInterval(() => {
    if (++currentPage < pages.length) renderPage();
    else pause.click();
  }, timing * 1000);
};

pause.onclick = () => {
  clearInterval(timer);
  clearInterval(lineTimer);
  stopTempo();
  timer = null;
  pause.disabled = true;
};

/* NAV */
prev.onclick = () => currentPage > 0 && (currentPage--, renderPage());
next.onclick = () => currentPage < pages.length - 1 && (currentPage++, renderPage());

/* TIMING + - */
plus.onclick = () => { timing++; updateHeader(); if (timer) pause.click(); };
minus.onclick = () => { if (timing > 1) timing--; updateHeader(); if (timer) pause.click(); };

/* FOLDER */
folder.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files[0];
  const txt = await file.text();
  sourceName = file.name;
  pages = splitPages(txt);
  currentPage = 0;
  updateHeader();
  renderPage();
};

/* LINK */
linkBtn.onclick = () => {
  overlay.style.display = "flex";
  overlayInput.placeholder = "Pega URL .txt";
};

overlayOk.onclick = async () => {
  if (overlayInput.placeholder.includes("URL")) {
    const res = await fetch(overlayInput.value);
    const txt = await res.text();
    sourceName = overlayInput.value.replace(/^https?:\/\//, "");
    pages = splitPages(txt);
    currentPage = 0;
  } else {
    timing = Math.max(1, parseInt(overlayInput.value));
  }
  overlayInput.value = "";
  overlay.style.display = "none";
  updateHeader();
  renderPage();
};

/* TIMING SET */
timingBtn.onclick = () => {
  overlay.style.display = "flex";
  overlayInput.placeholder = "Segundos por página";
  overlayInput.value = timing;
};
</script>

</body>
</html>
