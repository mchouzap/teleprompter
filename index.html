<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root {
  --btn-h: 32px;
  --font-size: 1.25rem;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* HEADER */
#header {
  padding: 6px 10px;
  font-size: 0.85rem;
  background: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* CONTROLS */
.controls {
  display: grid;
  gap: 6px;
  padding: 6px;
  background: #111;
}

.controls.top {
  grid-template-columns: repeat(8, 1fr);
}

.controls.bottom {
  grid-template-columns: repeat(5, 1fr);
}

button {
  height: var(--btn-h);
  border-radius: 6px;
  border: none;
  background: #1e88e5;
  color: #fff;
  font-size: 1rem;
}

button:disabled {
  background: #333;
  color: #777;
}

/* TEXT */
#textWrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#tempo {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #555;
}

.pulse { background: #1e88e5; }

#text {
  padding: 1vh 4vw;
  font-size: var(--font-size);
  line-height: 1.55;
  white-space: pre-wrap;
}

.line { padding: 0.08em 0; }
.highlight { background: rgba(30,136,229,0.28); }

</style>
</head>

<body>
<div id="app">

<div id="header">Use los botones de Carpeta y Link para cargar el texto</div>

<!-- TOP CONTROLS -->
<div class="controls top">
  <button id="folder">📁</button>
  <button id="linkBtn">🔗</button>

  <button id="timingBtn">⏱</button>
  <button id="timingPlus">➕</button>
  <button id="timingMinus">➖</button>

  <button id="fontBtn">🔤</button>
  <button id="fontPlus">➕</button>
  <button id="fontMinus">➖</button>
</div>

<!-- BOTTOM CONTROLS -->
<div class="controls bottom">
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <button id="fullscreen">⤢</button>
</div>

<div id="textWrapper">
  <div id="tempo"></div>
  <div id="text">Carga un texto para comenzar…</div>
</div>

<input id="fileInput" type="file" accept=".txt" hidden>

</div>

<script>
let pages = [];
let currentPage = 0;
let currentLine = 0;
let timer = null;
let lineTimer = null;
let tempoTimer = null;

let timing = 16;
let fontSize = 1.25;
let sourceName = "";
let wakeLock = null;

const textDiv = document.getElementById("text");
const header = document.getElementById("header");
const tempo = document.getElementById("tempo");

/* HEADER */
function updateHeader() {
  header.textContent = `${sourceName || "Texto"} | ⏱ ${timing}s`;
}

/* WAKE LOCK */
async function enableWakeLock() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
function disableWakeLock() {
  wakeLock?.release();
  wakeLock = null;
}

/* FULLSCREEN */
fullscreen.onclick = () =>
  document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen?.();

/* PAGINATION */
function splitPages(text) {
  const lines = text.split(/\r?\n+/);
  const out = [];
  for (let i = 0; i < lines.length; i += 15)
    out.push(lines.slice(i, i + 15));
  return out;
}

function renderPage() {
  currentLine = 0;
  textDiv.innerHTML = pages[currentPage]
    .map((l, i) => `<div class="line ${i === 0 ? "highlight" : ""}">${l}</div>`)
    .join("");
}

/* TEMPO */
function startTempo() {
  tempoTimer = setInterval(() => {
    tempo.classList.add("pulse");
    setTimeout(() => tempo.classList.remove("pulse"), 120);
  }, 1000 / timing);
}
function stopTempo() { clearInterval(tempoTimer); }

/* PLAY */
play.onclick = async () => {
  if (timer || !pages.length) return;
  pause.disabled = false;
  await enableWakeLock();
  startTempo();

  const lineDuration = (timing * 1000) / pages[currentPage].length;

  lineTimer = setInterval(() => {
    const lines = document.querySelectorAll(".line");
    if (currentLine < lines.length - 1) {
      lines[currentLine].classList.remove("highlight");
      currentLine++;
      lines[currentLine].classList.add("highlight");
    }
  }, lineDuration);

  timer = setInterval(() => {
    if (++currentPage < pages.length) renderPage();
    else pause.click();
  }, timing * 1000);
};

pause.onclick = () => {
  clearInterval(timer);
  clearInterval(lineTimer);
  stopTempo();
  disableWakeLock();
  timer = null;
  pause.disabled = true;
};

/* NAV */
prev.onclick = () => currentPage > 0 && (currentPage--, renderPage());
next.onclick = () => currentPage < pages.length - 1 && (currentPage++, renderPage());

/* TIMING + / - */
timingPlus.onclick = () => { timing++; updateHeader(); };
timingMinus.onclick = () => { if (timing > 1) timing--; updateHeader(); };

/* FONT SIZE + / - */
fontPlus.onclick = () => {
  fontSize = Math.min(3, fontSize + 0.1);
  document.documentElement.style.setProperty("--font-size", fontSize + "rem");
};
fontMinus.onclick = () => {
  fontSize = Math.max(0.8, fontSize - 0.1);
  document.documentElement.style.setProperty("--font-size", fontSize + "rem");
};

/* FILE */
folder.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files[0];
  const txt = await file.text();
  sourceName = file.name;
  pages = splitPages(txt);
  currentPage = 0;
  updateHeader();
  renderPage();
};

/* LINK */
linkBtn.onclick = async () => {
  const url = prompt("Pega URL .txt");
  if (!url) return;
  const res = await fetch(url);
  const txt = await res.text();
  sourceName = url.replace(/^https?:\/\//, "");
  pages = splitPages(txt);
  currentPage = 0;
  updateHeader();
  renderPage();
};

  /* URL PARAMETERS */
(function loadFromURL() {
  const params = new URLSearchParams(window.location.search);

  const textURL = params.get("text");
  const timingParam = params.get("timing");
  const fontParam = params.get("font");

  if (timingParam) {
    timing = Math.max(1, parseInt(timingParam));
    updateHeader();
  }

  if (fontParam) {
    fontSize = Math.max(1,parseFloat(fontParam));
    document.documentElement.style.setProperty(
      "--font-size",
      fontSize + "rem"
    );
  }

  if (textURL) {
    fetch(textURL)
      .then(r => r.text())
      .then(txt => {
        sourceName = textURL.replace(/^https?:\/\//, "");
        pages = splitPages(txt);
        currentPage = 0;
        updateHeader();
        renderPage();
      })
      .catch(() => console.warn("No se pudo cargar texto desde URL"));
  }
})();

</script>
</body>
</html>
