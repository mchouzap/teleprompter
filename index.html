<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chou's Teleprompter</title>

<style>
:root { --font-size: 1.25rem; }
*{box-sizing:border-box}

body{
  margin:0;background:#000;color:#fff;
  font-family:system-ui,sans-serif;
  height:100dvh;overflow:hidden;
}

#app{display:flex;flex-direction:column;height:100%}

#header{
  background:#111;padding:6px 10px;
  font-size:.85rem;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}

.controls{display:grid;gap:6px;padding:6px;background:#111}

.controls.top{
  grid-template-columns:
    1fr 1fr
    0.5fr .4fr .4fr
    0.5fr .4fr .4fr
    0.5fr;
}

.controls.bottom{grid-template-columns:repeat(5,1fr)}

button{
  height:32px;border:none;border-radius:6px;
  background:#1e88e5;color:#fff;font-size:1rem;
}
button:disabled{background:#333;color:#777}

#textWrapper{flex:1;position:relative;overflow:hidden}

#tempo{
  position:absolute;top:6px;right:10px;
  width:8px;height:8px;border-radius:50%;
  background:#555;
}
.pulse{background:#1e88e5}

#text{
  padding:1vh 4vw;
  font-size:var(--font-size);
  line-height:1.55;
  white-space:pre-wrap;
}

.line{padding:.12em 0}
.highlight{
  background:rgba(255,255,255,.35);
  border-left:4px solid #1e88e5;
  padding-left:.6em;
}
</style>
</head>

<body>
<div id="app">

<div id="header">
Para comenzar agrega un texto vía URL o carga el archivo *.txt
</div>

<div class="controls top">
  <button id="folder">📁</button>
  <button id="linkBtn">🔗</button>

  <button id="timingBtn">⏱</button>
  <button id="timingUp">⬆️</button>
  <button id="timingDown">⬇️</button>

  <button id="fontBtn">🔤</button>
  <button id="fontPlus">➕</button>
  <button id="fontMinus">➖</button>

  <button disabled>📄</button>
</div>

<div class="controls bottom">
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="prev">⏮</button>
  <button id="next">⏭</button>
  <button id="fullscreen">⤢</button>
</div>

<div id="textWrapper">
  <div id="tempo"></div>
  <div id="text">Chou’s Teleprompter</div>
</div>

<input id="fileInput" type="file" accept=".txt" hidden>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ========= STATE ========= */
  const state = {
    timing: 25,
    fontSize: 1.25,
    linesPerPage: 15,
    playing: false
  };

  let pages=[], currentPage=0, currentLine=0;
  let pageTimer=null, lineTimer=null, tempoTimer=null;
  let sourceName="", wakeLock=null;

  /* ========= DOM ========= */
  const $ = id => document.getElementById(id);

  const header = $("header");
  const textEl = $("text");
  const tempo = $("tempo");

  const playBtn = $("play");
  const pauseBtn = $("pause");

  /* ========= HELPERS ========= */
  const truncate=(t,m=32)=>t.length>m?t.slice(0,m-1)+"…":t;
  const isSkippable=l=>{
    const t=l.trim();
    return !t||t.startsWith("||")||t.startsWith("//")||t.startsWith("/*");
  };
  const isPauseLine=l=>l.trim().startsWith("##");

  /* ========= WAKE LOCK ========= */
  async function lockScreen(){
    try{ wakeLock=await navigator.wakeLock.request("screen"); }catch{}
  }
  function unlockScreen(){
    wakeLock?.release(); wakeLock=null;
  }

  /* ========= UI SYNC ========= */
  function syncUI(){
    document.documentElement.style
      .setProperty("--font-size", state.fontSize+"rem");

    if(sourceName){
      header.textContent =
        `${truncate(sourceName)} | ⏱ ${state.timing}s | 📄 ${state.linesPerPage}`;
    }
  }

  /* ========= PAGINATION ========= */
  function splitPages(txt){
    const l=txt.split(/\r?\n/), out=[];
    for(let i=0;i<l.length;i+=state.linesPerPage){
      out.push(l.slice(i,i+state.linesPerPage));
    }
    return out;
  }

  /* ========= RENDER ========= */
  function renderPage(){
    currentLine=0;
    textEl.innerHTML = pages[currentPage]
      .map(l=>`<div class="line">${l}</div>`).join("");
    advanceLine();
  }

  function advanceLine(){
    const lines=document.querySelectorAll(".line");
    while(currentLine<lines.length){
      const t=lines[currentLine].textContent;
      if(isPauseLine(t)){ pause(); return; }
      if(!isSkippable(t)){
        lines[currentLine].classList.add("highlight");
        return;
      }
      currentLine++;
    }
  }

  /* ========= TEMPO ========= */
  function startTempo(){
    stopTempo();
    tempoTimer=setInterval(()=>{
      tempo.classList.add("pulse");
      setTimeout(()=>tempo.classList.remove("pulse"),120);
    },1000/state.timing);
  }
  function stopTempo(){ clearInterval(tempoTimer); }

  /* ========= PLAYBACK ========= */
  function play(){
    if(state.playing||!pages.length) return;
    state.playing=true;
    pauseBtn.disabled=false;
    lockScreen();
    startTempo();

    const valid=pages[currentPage].filter(l=>!isSkippable(l)).length||1;
    const perLine=(state.timing*1000)/valid;

    lineTimer=setInterval(()=>{
      const lines=document.querySelectorAll(".line");
      lines[currentLine]?.classList.remove("highlight");
      currentLine++; advanceLine();
    },perLine);

    pageTimer=setInterval(()=>{
      currentPage++;
      if(currentPage>=pages.length){ pause(); return; }
      renderPage();
    },state.timing*1000);
  }

  function pause(){
    state.playing=false;
    clearInterval(pageTimer);
    clearInterval(lineTimer);
    stopTempo();
    unlockScreen();
    pauseBtn.disabled=true;
  }

  function restart(){
    if(state.playing){ pause(); play(); }
  }

  /* ========= CONTROLS ========= */
  playBtn.addEventListener("click", play);
  pauseBtn.addEventListener("click", pause);

  $("timingUp").addEventListener("click", ()=>{
    state.timing++; syncUI(); restart();
  });
  $("timingDown").addEventListener("click", ()=>{
    state.timing=Math.max(1,state.timing-1); syncUI(); restart();
  });

  $("fontPlus").addEventListener("click", ()=>{
    state.fontSize+=0.1; syncUI();
  });
  $("fontMinus").addEventListener("click", ()=>{
    state.fontSize=Math.max(.8,state.fontSize-.1); syncUI();
  });

  $("fullscreen").addEventListener("click", ()=>{
    document.fullscreenElement
      ? document.exitFullscreen()
      : document.documentElement.requestFullscreen();
  });

  $("folder").addEventListener("click", ()=>$("fileInput").click());

  $("fileInput").addEventListener("change", async e=>{
    const txt = await e.target.files[0].text();
    sourceName = e.target.files[0].name;
    pages = splitPages(txt);
    currentPage=0;
    syncUI(); renderPage();
  });

  $("linkBtn").addEventListener("click", async ()=>{
    const url = prompt("Pega URL .txt");
    if(!url) return;
    const txt = await (await fetch(url)).text();
    sourceName = url.replace(/^https?:\/\//,"");
    pages = splitPages(txt);
    currentPage=0;
    syncUI(); renderPage();
  });

  /* ========= URL PARAMS ========= */
  const p=new URLSearchParams(location.search);
  if(p.has("timing")) state.timing=+p.get("timing");
  if(p.has("font")) state.fontSize=+p.get("font");
  if(p.has("lines")) state.linesPerPage=+p.get("lines");

  if(p.has("text")){
    fetch(p.get("text"))
      .then(r=>r.text())
      .then(txt=>{
        sourceName=p.get("text").replace(/^https?:\/\//,"");
        pages=splitPages(txt);
        syncUI(); renderPage();
      });
  } else {
    syncUI();
  }
});
</script>
</body>
</html>
