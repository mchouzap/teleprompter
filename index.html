<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Área de texto (ligeramente reducida) */
#text {
  flex: 1;
  padding: 0.8rem 1rem;
  font-size: 1.3rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow: hidden;
}

/* Resaltado */
.highlight {
  background: rgba(30,136,229,0.25);
}

/* Controles */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.5rem;
  background: #111;
}

.controls input,
.controls button {
  flex: 1 1 30%;
  max-width: 100%;
  box-sizing: border-box;
  padding: 0.6rem;
  font-size: 1rem;
  border-radius: 6px;
  border: none;
}

.controls input[type="file"] {
  color: #aaa;
}

button:enabled {
  background: #1e88e5;
  color: white;
}

button:disabled {
  background: #333;
  color: #777;
}

/* Modo ocultar UI */
.hide-ui .controls {
  display: none;
}
</style>
</head>

<body>

<div id="text">Carga un texto para comenzar…</div>

<div class="controls">
  <input id="textUrl" placeholder="URL del texto (.txt)">
  <input id="timingInput" type="number" min="1" value="7" placeholder="Segundos">
  <input id="fileInput" type="file" accept=".txt">
  <button id="load">Cargar</button>

  <button id="prev">⏮</button>
  <button id="play">▶</button>
  <button id="pause" disabled>⏸</button>
  <button id="next">⏭</button>

  <button id="mirror">🔁</button>
  <button id="toggleUI">👁️</button>
  <button id="broadcast">📡</button>
</div>

<script>
let pages = [];
let currentPage = 0;
let timer = null;
let timing = 7;
let mirrored = false;
let broadcasting = false;

const textDiv = document.getElementById("text");
const pauseBtn = document.getElementById("pause");
let touchStartX = 0;

/* ---------- FULLSCREEN ---------- */
function enterFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  }
}

function exitFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen?.();
  }
}

/* ---------- PAGINACIÓN ---------- */
function splitPages(text) {
  const lines = text.split(/\r?\n+/);
  const perPage = 15;
  const result = [];
  for (let i = 0; i < lines.length; i += perPage) {
    result.push(lines.slice(i, i + perPage));
  }
  return result;
}

function showPage() {
  if (!pages.length) return;
  textDiv.innerHTML = pages[currentPage]
    .map((l, i) =>
      i === 0 ? `<div class="highlight">${l}</div>` : `<div>${l}</div>`
    ).join("");
}

/* ---------- PLAY / PAUSE ---------- */
function start() {
  if (timer || !pages.length) return;
  pauseBtn.disabled = false;
  enterFullscreen();

  timer = setInterval(() => {
    if (currentPage < pages.length - 1) {
      currentPage++;
      showPage();
    } else {
      stop();
    }
  }, timing * 1000);
}

function stop() {
  clearInterval(timer);
  timer = null;
  pauseBtn.disabled = true;
  if (!broadcasting) exitFullscreen();
}

play.onclick = start;
pause.onclick = stop;

/* ---------- NAVEGACIÓN ---------- */
next.onclick = () => {
  if (currentPage < pages.length - 1) {
    currentPage++;
    showPage();
  }
};

prev.onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    showPage();
  }
};

/* ---------- CARGAR TEXTO ---------- */
load.onclick = async () => {
  stop();
  currentPage = 0;
  timing = parseInt(timingInput.value) || 7;

  try {
    let txt = "";
    if (fileInput.files[0]) {
      txt = await fileInput.files[0].text();
    } else if (textUrl.value) {
      const res = await fetch(textUrl.value);
      txt = await res.text();
    } else {
      textDiv.textContent = "Carga un TXT o una URL.";
      return;
    }
    pages = splitPages(txt.replace(/\r/g, ""));
    showPage();
  } catch {
    textDiv.textContent = "Error cargando el texto.";
  }
};

/* ---------- SWIPE ---------- */
textDiv.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
});

textDiv.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) {
    diff < 0 ? next.onclick() : prev.onclick();
  }
});

/* ---------- MIRROR ---------- */
mirror.onclick = () => {
  mirrored = !mirrored;
  textDiv.style.transform = mirrored ? "scaleX(-1)" : "none";
};

/* ---------- TOGGLE UI ---------- */
toggleUI.onclick = () => {
  document.body.classList.toggle("hide-ui");
};

/* ---------- BROADCAST ---------- */
broadcast.onclick = () => {
  broadcasting = !broadcasting;
  document.body.classList.toggle("hide-ui", broadcasting);
  broadcasting ? enterFullscreen() : exitFullscreen();
};
</script>

</body>
</html>
