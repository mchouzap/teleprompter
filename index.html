<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teleprompter by Chou</title>

<style>
:root {
  --btn-h: 40px;
  --font-size: min(4.1vw, 1.3rem);
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

#progress {
  height: 3px;
  background: #1e88e5;
  width: 0%;
}

#tempo {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #555;
}

.pulse {
  background: #1e88e5;
}

#text {
  flex: 1;
  padding: 1vh 4vw;
  font-size: var(--font-size);
  line-height: 1.55;
  white-space: pre-wrap;
  overflow: hidden;
}

.line {
  padding: 0.1em 0;
}

.highlight {
  background: rgba(30,136,229,0.3);
}

/* CONTROLES */
.controls {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px;
  background: #111;
}

.row {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
}

.controls input,
.controls button {
  height: var(--btn-h);
  font-size: 1rem;
  border-radius: 6px;
  border: none;
}

.controls input {
  padding: 0 6px;
}

.controls button {
  background: #1e88e5;
  color: #fff;
}

button:disabled {
  background: #333;
  color: #777;
}

.icon {
  font-size: 1.1rem;
}
</style>
</head>

<body>

<div id="tempo"></div>
<div id="progress"></div>

<div id="text">Carga un texto o URL al texto para comenzar…</div>

<div class="controls">

  <!-- FILA 1 -->
  <div class="row">
    <input id="textUrl" placeholder="URL .txt" style="grid-column: span 4;">
    <button id="load" class="icon" style="grid-column: span 1;">📂</button>

    <input id="timingInput" type="number" min="1" value="7" style="grid-column: span 2;">

    <button id="minus" class="icon" style="grid-column: span 1;">➖</button>
    <button id="plus" class="icon" style="grid-column: span 1;">➕</button>

    <input id="fileInput" type="file" accept=".txt" hidden>
  </div>

  <!-- FILA 2 -->
  <div class="row">
    <button id="play" class="icon" style="grid-column: span 2;">▶</button>
    <button id="pause" class="icon" disabled style="grid-column: span 2;">⏸</button>
    <button id="prev" class="icon" style="grid-column: span 2;">⏮</button>
    <button id="next" class="icon" style="grid-column: span 2;">⏭</button>
    <button id="fullscreen" class="icon" style="grid-column: span 2;">⤢</button>
  </div>

</div>

<script>
let pages = [];
let currentPage = 0;
let currentLine = 0;
let timer = null;
let lineTimer = null;
let tempoTimer = null;

const textDiv = document.getElementById("text");
const progress = document.getElementById("progress");
const pauseBtn = document.getElementById("pause");
const tempo = document.getElementById("tempo");
const timingInput = document.getElementById("timingInput");

/* FULLSCREEN */
function enterFullscreen() {
  document.documentElement.requestFullscreen?.();
}
function exitFullscreen() {
  document.exitFullscreen?.();
}

/* PAGINACIÓN — 12 líneas */
function splitPages(text) {
  const lines = text.split(/\r?\n+/);
  const perPage = 12;
  const out = [];
  for (let i = 0; i < lines.length; i += perPage) {
    out.push(lines.slice(i, i + perPage));
  }
  return out;
}

function renderPage() {
  currentLine = 0;
  textDiv.innerHTML = pages[currentPage]
    .map((l, i) =>
      `<div class="line ${i === 0 ? "highlight" : ""}">${l}</div>`
    ).join("");
  progress.style.width = "0%";
}

/* RITMO */
function startTempo(timing) {
  const interval = 1000 / timing;
  tempoTimer = setInterval(() => {
    tempo.classList.add("pulse");
    setTimeout(() => tempo.classList.remove("pulse"), 120);
  }, interval);
}
function stopTempo() {
  clearInterval(tempoTimer);
}

/* PLAY */
function start() {
  if (timer || !pages.length) return;

  const timing = parseInt(timingInput.value) || 7;

  pauseBtn.disabled = false;
  enterFullscreen();
  startTempo(timing);

  const linesCount = pages[currentPage].length;
  const lineDuration = (timing * 1000) / linesCount;
  let elapsed = 0;

  lineTimer = setInterval(() => {
    const lines = document.querySelectorAll(".line");
    if (currentLine < lines.length - 1) {
      lines[currentLine].classList.remove("highlight");
      currentLine++;
      lines[currentLine].classList.add("highlight");
    }
  }, lineDuration);

  timer = setInterval(() => {
    if (currentPage < pages.length - 1) {
      currentPage++;
      renderPage();
    } else {
      stop();
    }
  }, timing * 1000);

  const progressTimer = setInterval(() => {
    elapsed += 100;
    progress.style.width = `${(elapsed / (timing * 1000)) * 100}%`;
    if (!timer) clearInterval(progressTimer);
  }, 100);
}

function stop() {
  clearInterval(timer);
  clearInterval(lineTimer);
  stopTempo();
  timer = null;
  pauseBtn.disabled = true;
  exitFullscreen();
}

/* CONTROLES */
play.onclick = start;
pause.onclick = stop;

next.onclick = () => {
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage();
  }
};

prev.onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
  }
};

fullscreen.onclick = () => {
  document.fullscreenElement ? exitFullscreen() : enterFullscreen();
};

/* TIMING ➖ ➕ */
minus.onclick = () => {
  let v = parseInt(timingInput.value) || 7;
  if (v > 1) timingInput.value = v - 1;
  if (timer) { stop(); start(); }
};

plus.onclick = () => {
  let v = parseInt(timingInput.value) || 7;
  timingInput.value = v + 1;
  if (timer) { stop(); start(); }
};

/* LOAD */
load.onclick = () => fileInput.click();

fileInput.onchange = async () => {
  stop();
  let txt = "";
  if (fileInput.files[0]) {
    txt = await fileInput.files[0].text();
  }
  pages = splitPages(txt.replace(/\r/g, ""));
  currentPage = 0;
  renderPage();
};
</script>

</body>
</html>
